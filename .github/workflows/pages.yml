name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Nur Seitendateien bereitstellen
        run: |
          mkdir _site
          cp index.html nahrungsergaenzungsmittel-experte.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
        # Das frisch hochgeladene Artefakt ist manchmal noch nicht abrufbar ("No artifacts named github-pages")
        continue-on-error: true
      - name: Kurz warten vor zweitem Deploy-Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        name: Zweiter Deploy-Versuch
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
